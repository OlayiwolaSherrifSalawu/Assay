name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned to the module's own version rather than `stable`. When
      # `stable` moved to Go 1.27, golangci-lint v2.12.2 (built with 1.26)
      # panicked type-checking the newer standard library, and this check
      # failed on every push for reasons unrelated to the code under test.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test merge gate
        run: make test-gate

      # Tests must pass without network access: every check is a pure function
      # over fixtures captured under internal/*/testdata.
      #
      # The same run records coverage, so the numbers cost no second test pass.
      # The default bash shell runs with pipefail, so tee does not hide a
      # failing test.
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./... 2>&1 | tee go-test.log

      # Per-package coverage, in the log and in the job summary. It reports and
      # does not gate: there is no threshold (#130). It also sends nothing to a
      # third-party service. The report is computed here from `go test` output,
      # and the profile is kept as a GitHub artifact. Runs after a test failure
      # too, since partial numbers are still information.
      - name: coverage report
        if: ${{ !cancelled() }}
        run: |
          report=$(./scripts/coverage-report.sh go-test.log coverage.out)
          printf '%s\n' "$report"
          {
            echo "### Go coverage"
            echo
            printf '%s\n' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
          if-no-files-found: warn

  # evidence_hash is the project's reproducibility claim: anyone re-scanning an
  # attested asset must derive byte-identical preimage bytes, whatever Go they
  # run. CI's main job tests one pinned version (go.mod); contributors run
  # others. Map iteration order, strconv formatting and string sorting are
  # where a toolchain difference would surface, so the attest package — the
  # golden byte comparison and its vectors — runs on one older and one newer
  # Go version than the pin. A version that changes the bytes fails here
  # instead of shipping as an unexplained hash mismatch.
  #
  # Deliberately narrow, so it does not meaningfully slow CI: this package
  # only, no race detector, no coverage, no matrix for the rest of the module.
  # Explicit versions rather than `stable`: setup-go resolves `stable` to a
  # moving target, which is the same trap the main job's go-version-file pin
  # avoids for golangci-lint.
  attest-reproducibility:
    name: attest on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # Pure functions over committed fixtures under internal/attest/testdata:
      # no network access needed.
      - name: go test ./internal/attest/
        run: go test ./internal/attest/

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Pinned to the module's own version rather than `stable`. When
      # `stable` moved to Go 1.27, golangci-lint v2.12.2 (built with 1.26)
      # panicked type-checking the newer standard library, and this check
      # failed on every push for reasons unrelated to the code under test.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: lint shell scripts
        run: find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assay-contracts
    steps:
      - uses: actions/checkout@v7.0.1

      - name: rust toolchain
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: check contract test snapshots
        run: |
          if ! git diff --exit-code -- contracts/example-gate/test_snapshots contracts/safety-registry/test_snapshots; then
            echo "::error::Contract tests modified committed snapshots. Review the changed files and commit intentional snapshot updates."
            exit 1
          fi

  # Merge gate: catches PRs that touch maintainer-owned safety-critical paths
  # without manual review. A PR touching only docs or tests merges cleanly;
  # one touching the severity model, the evidence_hash encoding, or the
  # contract's fail-closed logic must be reviewed.
  #
  # The logic lives in scripts/merge-gate.sh so it can be verified offline
  # against real commit ranges before it is trusted against a real PR. Note
  # BASE uses the merge base rather than the PR's base sha directly: force-push
  # history on the base branch can otherwise make every path look changed.
  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: verify CODEOWNERS paths
        run: ./scripts/check-codeowners.sh

      - name: check maintainer-owned paths
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }})

          set +e
          out=$(./scripts/merge-gate.sh "$BASE" ${{ github.event.pull_request.head.sha }} 2>&1)
          rc=$?
          set -e

          printf '%s\n' "$out"
          {
            echo "### Merge gate"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A hold is advisory. The gate says a maintainer should look at this
          # PR; it does not say the PR is wrong, and most of the contributor
          # backlog legitimately touches these paths -- an issue asking someone
          # to change the severity model cannot be completed without editing
          # the severity model. Failing CI for that told contributors their
          # correct work was broken. Exit 2 is a real failure: the gate could
          # not run, so its finding is unknown rather than clean.
          case "$rc" in
            0) echo "::notice title=Merge gate::No maintainer-owned paths or dependency files touched." ;;
            1) echo "::notice title=Merge gate::Touches maintainer-owned paths -- a maintainer should review before merge. Advisory: this does not fail CI." ;;
            *) echo "::error title=Merge gate::The gate could not run (exit $rc), so its finding is unknown."; exit 1 ;;
          esac
